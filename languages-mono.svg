<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="165" viewBox="0 0 440 165" fill="none" role="img" aria-labelledby="descId">
  <defs>
    <filter id="reithomato-crimson" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0" result="gray" />
      <feComponentTransfer in="gray">
        <feFuncR type="table" tableValues="0.055 0.96" />
        <feFuncG type="table" tableValues="0.012 0.55" />
        <feFuncB type="table" tableValues="0.025 0.62" />
      </feComponentTransfer>
    </filter>
  </defs>
  <title id="titleId" />
  <desc id="descId" />
  <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #E8798E;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #F3E7EA;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #F3E7EA;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    .progress-background { fill: #5A1D2D; }
    
          

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          
        </style>
  <defs>
          
          
        </defs>
  <g filter="url(#reithomato-crimson)">
    <rect data-testid="card-bg" class="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="439" fill="#0D080B00" stroke-opacity="0" />
    <g data-testid="card-title" transform="translate(25, 35)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="header" data-testid="header">⌘ LANGUAGES</text>
      </g>
    </g>
    <g data-testid="main-card-body" transform="translate(0, 55)">
      <svg data-testid="lang-items" x="25">
        <mask id="rect-mask">
          <rect x="0" y="0" width="390" height="8" fill="white" rx="5" />
        </mask>
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="0" y="0" width="148.69" height="8" fill="#3178c6" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="148.69" y="0" width="68.32" height="8" fill="#f1e05a" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="217.01" y="0" width="68.22" height="8" fill="#A97BFF" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="285.23" y="0" width="54.38" height="8" fill="#663399" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="339.61" y="0" width="50.4" height="8" fill="#e34c26" />
        <g transform="translate(0, 25)">
          <g transform="translate(0, 0)">
            <g transform="translate(0, 0)">
              <g class="stagger" style="animation-delay: 450ms">
                <circle cx="5" cy="6" r="5" fill="#3178c6" />
                <text data-testid="lang-name" x="15" y="10" class="lang-name">
        TypeScript 38.12%
      </text>
              </g>
            </g>
            <g transform="translate(0, 25)">
              <g class="stagger" style="animation-delay: 600ms">
                <circle cx="5" cy="6" r="5" fill="#f1e05a" />
                <text data-testid="lang-name" x="15" y="10" class="lang-name">
        JavaScript 17.52%
      </text>
              </g>
            </g>
            <g transform="translate(0, 50)">
              <g class="stagger" style="animation-delay: 750ms">
                <circle cx="5" cy="6" r="5" fill="#A97BFF" />
                <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Kotlin 17.49%
      </text>
              </g>
            </g>
          </g>
          <g transform="translate(150, 0)">
            <g transform="translate(0, 0)">
              <g class="stagger" style="animation-delay: 450ms">
                <circle cx="5" cy="6" r="5" fill="#663399" />
                <text data-testid="lang-name" x="15" y="10" class="lang-name">
        CSS 13.94%
      </text>
              </g>
            </g>
            <g transform="translate(0, 25)">
              <g class="stagger" style="animation-delay: 600ms">
                <circle cx="5" cy="6" r="5" fill="#e34c26" />
                <text data-testid="lang-name" x="15" y="10" class="lang-name">
        HTML 12.92%
      </text>
              </g>
            </g>
          </g>
        </g>
      </svg>
    </g>
  </g>
</svg>
