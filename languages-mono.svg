<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="285" viewBox="0 0 440 285" fill="none" role="img" aria-labelledby="descId">
  <defs>
    <filter id="reithomato-crimson" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0" result="gray" />
      <feComponentTransfer in="gray">
        <feFuncR type="table" tableValues="0.055 0.96" />
        <feFuncG type="table" tableValues="0.012 0.55" />
        <feFuncB type="table" tableValues="0.025 0.62" />
      </feComponentTransfer>
    </filter>
  </defs>
  <title id="titleId" />
  <desc id="descId" />
  <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #E8798E;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #F3E7EA;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #F3E7EA;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    .progress-background { fill: #5A1D2D; }
    
          

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          
        </style>
  <defs>
          
          
        </defs>
  <g filter="url(#reithomato-crimson)">
    <rect data-testid="card-bg" class="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="439" fill="#0D080B00" stroke-opacity="0" />
    <g data-testid="card-title" transform="translate(25, 35)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="header" data-testid="header">⌘ LANGUAGES</text>
      </g>
    </g>
    <g data-testid="main-card-body" transform="translate(0, 55)">
      <svg data-testid="lang-items" x="25">
        <g transform="translate(0, 0)">
          <g class="stagger" style="animation-delay: 450ms">
            <text data-testid="lang-name" x="2" y="15" class="lang-name">TypeScript</text>
            <text x="355" y="34" class="lang-name">38.12%</text>
            <svg width="345" x="0" y="25">
              <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="345" height="8" />
              <svg data-testid="lang-progress" width="38.1249718634955%">
                <rect height="8" fill="#3178c6" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 750ms;" />
              </svg>
            </svg>
          </g>
        </g>
        <g transform="translate(0, 40)">
          <g class="stagger" style="animation-delay: 600ms">
            <text data-testid="lang-name" x="2" y="15" class="lang-name">JavaScript</text>
            <text x="355" y="34" class="lang-name">17.52%</text>
            <svg width="345" x="0" y="25">
              <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="345" height="8" />
              <svg data-testid="lang-progress" width="17.51790180763937%">
                <rect height="8" fill="#f1e05a" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 900ms;" />
              </svg>
            </svg>
          </g>
        </g>
        <g transform="translate(0, 80)">
          <g class="stagger" style="animation-delay: 750ms">
            <text data-testid="lang-name" x="2" y="15" class="lang-name">Kotlin</text>
            <text x="355" y="34" class="lang-name">17.49%</text>
            <svg width="345" x="0" y="25">
              <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="345" height="8" />
              <svg data-testid="lang-progress" width="17.491060874743347%">
                <rect height="8" fill="#A97BFF" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 1050ms;" />
              </svg>
            </svg>
          </g>
        </g>
        <g transform="translate(0, 120)">
          <g class="stagger" style="animation-delay: 900ms">
            <text data-testid="lang-name" x="2" y="15" class="lang-name">CSS</text>
            <text x="355" y="34" class="lang-name">13.94%</text>
            <svg width="345" x="0" y="25">
              <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="345" height="8" />
              <svg data-testid="lang-progress" width="13.942383372964478%">
                <rect height="8" fill="#663399" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 1200ms;" />
              </svg>
            </svg>
          </g>
        </g>
        <g transform="translate(0, 160)">
          <g class="stagger" style="animation-delay: 1050ms">
            <text data-testid="lang-name" x="2" y="15" class="lang-name">HTML</text>
            <text x="355" y="34" class="lang-name">12.92%</text>
            <svg width="345" x="0" y="25">
              <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="345" height="8" />
              <svg data-testid="lang-progress" width="12.9236820811573%">
                <rect height="8" fill="#e34c26" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 1350ms;" />
              </svg>
            </svg>
          </g>
        </g>
      </svg>
    </g>
  </g>
</svg>
