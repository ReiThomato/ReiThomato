name: Refresh REITHOMATO profile panels

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_languages_card.py"
      - ".github/workflows/update-languages.yml"

permissions:
  contents: write

concurrency:
  group: reithomato-profile-panels
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate both panels and the combined canvas
        run: python scripts/update_languages_card.py

      - name: Commit refreshed profile visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages-mono.svg royal-panels.svg
          if git diff --cached --quiet; then
            echo "Profile visuals are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh REITHOMATO profile panels"
          git push
