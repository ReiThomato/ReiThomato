name: Refresh profile visuals

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, at :17. GitHub warns that "high load times include the
    # start of every hour" and that queued runs can even be dropped, so the
    # slot deliberately avoids :00. Four windows a day mean a late or dropped
    # run is covered by the next one within a few hours.
    - cron: "17 */3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/render_profile.py"
      - ".github/workflows/update-languages.yml"

permissions:
  contents: write

concurrency:
  group: reithomato-profile-visuals
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the panels from the GitHub API
        # PROFILE_TOKEN is a fine-grained token with read access to the
        # profile's own (private) repositories. Without it the language
        # card would silently drop every private repository.
        run: python scripts/render_profile.py
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_LOGIN: ReiThomato

      - name: Commit the refreshed visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add royal-panels.svg royal-panels-dark.svg languages-mono.svg assets/
          if git diff --cached --quiet; then
            echo "Profile visuals are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile visuals"
          git push
